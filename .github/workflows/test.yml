name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Lint, build, and test
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run test:types
      - name: Build library
        run: bun run build
      - name: Build declarations
        run: bun run build:dts
      - name: Dist output checks
        run: bun run test:dist
      - name: DTS consumer check
        run: bun run test:dts
      - name: Unit tests
        run: bun run test:unit
      - name: Build demo
        run: bun run build:demo
